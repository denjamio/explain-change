# Lint settings only: explain-change has no dependencies and is not packaged.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are data: repository files and insights written as long strings.
"tests/**" = ["E501"]
"examples/**" = ["E501"]
