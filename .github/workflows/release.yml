name: Release

# Push a tag vX.Y.Z (matching package.json) to publish the binaries, the npm package and the plugin version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: The tag matches the version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun run check
      - run: bun run build
      - run: bun run compile
      - name: GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/bin/* --title "$GITHUB_REF_NAME" --notes "$notes"
      - name: npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: npm skipped
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; the npm package was not published"
