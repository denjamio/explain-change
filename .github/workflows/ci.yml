name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4  # runs the report template in tests/test_package.py
        with:
          node-version: "20"
      - name: Unit, end-to-end and template tests
        run: python -m unittest discover -s tests -v
      - name: Install into a temporary home
        run: |
          export HOME="$RUNNER_TEMP/home"
          python explain_change.py install
          python explain_change.py install   # a second run must be a no-op
          "$HOME/.local/bin/explain-change" --help
          test -f "$HOME/.claude/skills/explain-change/SKILL.md"
          test ! -e "$HOME/.claude/skills/explain-change/examples"   # only runtime files are linked
          "$HOME/.claude/skills/explain-change/explain_change.py" --help   # runs through the link

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check .

  examples:
    name: Examples are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the synthetic examples
        run: python examples/build_examples.py
      - name: Fail if the committed reports differ
        run: git diff --exit-code -- examples/
