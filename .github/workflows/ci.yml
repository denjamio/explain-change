name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  artifacts:
    name: Examples, schemas, npm bundle and binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: bun install --frozen-lockfile
      - name: Examples and schemas are up to date
        run: |
          bun --version && git --version
          bun run examples
          bun run schemas
          if ! git diff --quiet -- examples schemas; then
            # Annotations are readable without signing in: say what differs.
            echo "::error title=Stale examples or schemas::$(git diff --stat -- examples schemas | tail -n 8 | tr '\n' '|')"
            echo "::error title=What differs::$(bun scripts/compare-reports.ts $(git diff --name-only -- 'examples/*.html') | tr '\n' '|')"
            exit 1
          fi
      - name: The npm bundle runs on Node 20
        run: |
          bun run build
          node dist/explain-change.js --version
          cd "$RUNNER_TEMP" && git init -q -b main demo && cd demo
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m base
          git checkout -qb feature && mkdir -p app/models && echo 'class Order; end' > app/models/order.rb
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm feature
          node "$GITHUB_WORKSPACE/dist/explain-change.js" local --base main --no-open --json
      - name: The standalone binary runs
        run: |
          bun run compile bun-linux-x64
          dist/bin/explain-change-linux-x64 --version
          dist/bin/explain-change-linux-x64 schema explanation > /dev/null
