name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4  # runs the report template in tests/test_package.py
        with:
          node-version: "20"
      - name: Unit, end-to-end and template tests
        shell: bash
        run: |  # failures become annotations, readable without signing in
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || python .github/report_failure.py tests "$RUNNER_TEMP/tests.log"
          exit "$status"
      - name: Install into a temporary home
        if: runner.os == 'Linux'
        run: |
          export HOME="$RUNNER_TEMP/home"
          python explain_change.py install
          python explain_change.py install   # a second run must be a no-op
          "$HOME/.local/bin/explain-change" --version
          test -f "$HOME/.claude/skills/explain-change/SKILL.md"
          test ! -e "$HOME/.claude/skills/explain-change/examples"   # only runtime files are linked
          "$HOME/.claude/skills/explain-change/explain_change.py" --help   # runs through the link

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check --output-format=github .

  examples:
    name: Examples are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the synthetic examples
        run: python examples/build_examples.py
      - name: Fail if the committed reports differ
        run: git diff --quiet -- examples/ || { python .github/report_failure.py examples; exit 1; }
