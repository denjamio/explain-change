# Chatwoot: open-source customer support, with an omnichannel inbox.
# A Rails app: the REST API and the Vue dashboard on top; each context keeps its models and services together;
# jobs and event listeners run the async work; channels (WhatsApp, Facebook, e-mail…) and e-mail
# delivery are the adapters to the outside. enterprise/ overlays and extends the open-source code (AGENTS.md).

[project]
name = "Chatwoot"
direction = "Rails conventions by context: controllers stay thin; each context keeps its rules in models and app/services; jobs and event listeners run the async work; channel code talks to the messaging providers. Enterprise code extends the open-source code from enterprise/, never the reverse."
lang = "en"

[[layers]]
id = "web"
name = "Web"

[[layers]]
id = "domain"
name = "Domain"

[[layers]]
id = "async"
name = "Async"

[[layers]]
id = "adapters"
name = "Adapters"

[[layers]]
id = "platform"
name = "Platform"

[rules]
# The open-source code never depends on the enterprise overlay, and the domain never reaches back into the web layer.
# enterprise/ mirrors app/: its controllers sit with the web, Captain and the overlays with the domain, its jobs with the
# async work and Voice with the channels. Rails configuration and initializers belong to Platform.
allow = ["web -> domain", "web -> async", "web -> adapters", "web -> platform", "domain -> async", "domain -> adapters", "domain -> platform", "async -> domain", "async -> adapters", "async -> platform", "adapters -> domain", "adapters -> async", "adapters -> platform"]
forbid = ["domain -> web", "conversations -> enterprise", "contacts -> enterprise", "inboxes -> enterprise", "accounts -> enterprise", "conversations -> captain", "contacts -> captain", "inboxes -> captain", "accounts -> captain"]
same_layer = true

# ── Web ──────────────────────────────────────────────────────────────────────────────────────────────────

[[components]]
id = "dashboard"
name = "Agent dashboard"
layer = "web"
paths = ["app/javascript/dashboard/**", "app/javascript/v3/**", "app/javascript/design-system/**", "app/javascript/shared/**", "app/javascript/superadmin**", "app/javascript/entrypoints/**", "app/javascript/histoire.setup.ts"]
desc = "Owns the Vue app agents and admins work in: conversations, contacts, inbox and account settings."

[[components]]
id = "widget-portal"
name = "Widget and portal"
layer = "web"
paths = ["app/javascript/widget/**", "app/javascript/sdk/**", "app/javascript/survey/**", "app/javascript/portal/**", "app/views/public/**", "app/views/widgets/**"]
desc = "Owns what customers see: the website chat widget and its SDK, CSAT surveys and the help center portal."

[[components]]
id = "rest-api"
name = "REST API"
layer = "web"
paths = ["app/controllers/**", "app/views/**", "app/policies/**", "app/presenters/**", "app/dashboards/**", "config/routes.rb", "swagger/**"]
desc = "Owns the HTTP endpoints, their JSON views, the Pundit policies that decide who may call them and the super admin."

[[components]]
id = "captain-api"
name = "Captain API"
layer = "web"
paths = ["enterprise/app/controllers/api/v1/accounts/captain/**", "enterprise/app/views/api/v1/accounts/captain/**", "enterprise/app/policies/captain/**"]
desc = "Owns the endpoints agents and admins use to set up Captain: assistants, documents, scenarios, custom tools and copilot."

[[components]]
id = "enterprise-api"
name = "Enterprise API"
layer = "web"
paths = ["enterprise/app/controllers/**", "enterprise/app/views/**", "enterprise/app/policies/**", "enterprise/app/presenters/**", "enterprise/app/fields/**"]
desc = "Owns the enterprise endpoints and their overlays on the open-source ones: SLAs, custom roles, billing and super admin limits."


# ── Domain: each context with its models and services ───────────────────────────────────────────────────

[[components]]
id = "conversations"
name = "Conversations"
layer = "domain"
paths = ["app/models/conversation**", "app/models/message**", "app/models/attachment**", "app/models/mention**", "app/models/note**", "app/models/custom_filter**", "app/models/folder**", "app/services/conversations/**", "app/services/messages/**", "app/services/search**", "app/services/filter**", "app/builders/conversation**", "app/builders/messages/**", "app/finders/**"]
desc = "Owns Conversation, Message and Attachment; the thread between a contact and the team, its status and assignee."

[[components]]
id = "contacts"
name = "Contacts"
layer = "domain"
paths = ["app/models/contact**", "app/models/custom_attribute_definition**", "app/models/data_import**", "app/services/contact**", "app/services/crm/**", "app/services/data_import**", "app/actions/**", "app/builders/contact_inbox**"]
desc = "Owns Contact and ContactInbox; who a customer is, across inboxes, and contact imports and merges."

[[components]]
id = "inboxes"
name = "Inboxes"
layer = "domain"
paths = ["app/models/inbox**", "app/models/assignment_policy**", "app/models/working_hour**", "app/models/email_template**", "app/models/campaign**", "app/models/concerns/inbox_*", "app/models/concerns/out_of_offisable**", "app/models/concerns/channelable**", "app/builders/campaigns/**"]
desc = "Owns Inbox, its members, working hours, assignment policies, branded e-mail templates and campaigns; 1 inbox per channel."

[[components]]
id = "accounts"
name = "Accounts"
layer = "domain"
paths = ["app/models/account**", "app/models/user**", "app/models/team**", "app/models/access_token**", "app/models/super_admin**", "app/models/installation_config**", "app/models/platform_app**", "app/models/notification**", "app/models/concerns/account_*", "app/services/account**", "app/services/mfa/**", "app/services/onboarding/**", "app/services/notification/**", "app/services/user_session_tracking**", "app/builders/account_builder**", "app/builders/agent_builder**", "app/builders/notification**"]
desc = "Owns accounts, users, teams, access tokens, sign-in and agents' notifications; who works in which account."

[[components]]
id = "automation"
name = "Automation"
layer = "domain"
paths = ["app/models/automation_rule**", "app/models/macro**", "app/models/label**", "app/models/canned_response**", "app/models/agent_bot**", "app/services/automation_rules/**", "app/services/macros/**", "app/services/auto_assignment/**", "app/services/labels/**", "app/services/action_service**"]
desc = "Owns automation rules, macros, labels, canned responses, agent bots and auto-assignment."

[[components]]
id = "reports"
name = "Reports"
layer = "domain"
paths = ["app/models/reporting_event**", "app/models/csat_survey_response**", "app/services/reporting_events/**", "app/services/reports/**", "app/services/csat_**", "app/builders/v2/**", "app/builders/csat_surveys/**", "app/builders/year_in_review**"]
desc = "Owns reporting events, report builders and CSAT survey results."

[[components]]
id = "help-center"
name = "Help center"
layer = "domain"
paths = ["app/models/portal**", "app/models/article**", "app/models/category**", "app/models/related_category**", "app/models/kbase**"]
desc = "Owns portals, articles and categories of the public help center."



[[components]]
id = "captain"
name = "Captain"
layer = "domain"
paths = ["enterprise/app/*/captain/**", "enterprise/app/models/concerns/captain_*", "enterprise/app/models/concerns/toolable**", "enterprise/app/models/concerns/agentable**", "enterprise/lib/captain/**", "enterprise/lib/enterprise/captain/**", "lib/captain**", "lib/integrations/captain/**"]
desc = "Owns Captain, the AI agent: assistants, their documents and FAQs, scenarios, tools, and the replies it drafts or sends."

[[components]]
id = "enterprise"
name = "Enterprise edition"
layer = "domain"
paths = ["enterprise/**"]
desc = "Owns the enterprise overlays on the open-source models and services: SLAs, conversation monitors, custom roles and billing."

[[components]]
id = "shared-kernel"
name = "Shared kernel"
layer = "domain"
paths = ["app/models/**", "app/helpers/**", "app/fields/**", "app/services/**", "app/builders/**"]
desc = "Owns ApplicationRecord, shared model concerns and the helpers every context uses; no business rules."

# ── Async ────────────────────────────────────────────────────────────────────────────────────────────────

[[components]]
id = "background-jobs"
name = "Jobs and events"
layer = "async"
paths = ["app/jobs/**", "enterprise/app/jobs/**", "app/listeners/**", "enterprise/app/listeners/**", "app/dispatchers/**", "lib/events/**", "app/channels/**"]
desc = "Owns the Sidekiq jobs of both editions and the event dispatcher with its listeners and ActionCable channels."


# ── Adapters: the messaging providers and e-mail ─────────────────────────────────────────────────────────

[[components]]
id = "whatsapp"
name = "WhatsApp"
layer = "adapters"
paths = ["app/models/channel/whatsapp**", "app/services/whatsapp/**", "app/jobs/channels/whatsapp/**", "app/controllers/api/v1/accounts/concerns/whatsapp_*"]
desc = "Owns the WhatsApp channel: Cloud API and 360dialog providers, templates and phone number health."

[[components]]
id = "voice"
name = "Voice"
layer = "adapters"
paths = ["enterprise/app/services/voice/**", "enterprise/app/services/twilio/**", "enterprise/app/jobs/voice/**", "enterprise/app/controllers/twilio/**", "enterprise/app/controllers/concerns/twilio_voice**", "enterprise/app/models/concerns/call_recording**", "enterprise/lib/voice/**"]
desc = "Owns the Voice channel on Twilio: inbound and outbound calls, ringing agents, recordings and transcriptions."

[[components]]
id = "other-channels"
name = "Other channels"
layer = "adapters"
paths = ["app/models/channel/**", "app/services/facebook/**", "app/services/instagram/**", "app/services/twilio/**", "app/services/telegram/**", "app/services/line/**", "app/services/sms/**", "app/services/tiktok/**", "app/services/twitter/**", "app/services/imap/**", "app/services/microsoft/**", "app/services/google/**", "app/services/widget/**", "app/mailboxes/**", "app/jobs/channels/**"]
desc = "Owns the other channels: web widget, e-mail (IMAP, Microsoft, Google), Facebook, Instagram, SMS, Telegram, LINE, TikTok and X."

[[components]]
id = "email-delivery"
name = "E-mail delivery"
layer = "adapters"
paths = ["app/mailers/**", "enterprise/app/mailers/**", "app/drops/**", "enterprise/app/drops/**", "app/views/mailers/**", "app/services/email_templates/**", "app/services/email/**", "app/services/liquid/**"]
desc = "Owns outgoing e-mail: mailers, the Liquid drops that templates read, and the template resolver."

[[components]]
id = "integrations"
name = "Integrations"
layer = "adapters"
paths = ["app/models/integrations**", "app/models/webhook**", "app/models/dashboard_app**", "app/services/linear/**", "app/services/llm_formatter/**", "lib/integrations/**", "lib/linear**", "lib/webhooks/**", "lib/llm**"]
desc = "Owns the integrations: Slack, Linear, Dialogflow, the LLM providers, dashboard apps and outgoing webhooks."

# ── Platform ─────────────────────────────────────────────────────────────────────────────────────────────

[[components]]
id = "platform"
name = "Platform"
layer = "platform"
paths = ["config/**", "lib/**", "db/**"]
desc = "Owns configuration, feature flags, the database schema and migrations, and the shared libraries in lib/."

[[flows]]
id = "receive-message"
title = "Receive a customer message"
steps = [
  "other-channels -> conversations : Messages::MessageBuilder",
  "conversations -> background-jobs : dispatch message.created",
  "background-jobs -> dashboard : ActionCable broadcast",
]

[[flows]]
id = "reply-by-email"
title = "Reply to a conversation by e-mail"
steps = [
  "rest-api -> conversations : create the outgoing message",
  "background-jobs -> email-delivery : ConversationReplyMailer",
]

[glossary]
account = "A company's workspace: its inboxes, agents, contacts and settings."
inbox = "1 channel connected to an account, such as a WhatsApp number or a support e-mail address."
channel = "The messaging provider behind an inbox: WhatsApp, e-mail, Facebook, the website widget…"
conversation = "The thread between a contact and the team in 1 inbox, with a status and an assignee."
contact = "A customer the team talks to, across 1 or more inboxes."
agent = "A user who answers conversations."
"canned response" = "A saved reply an agent inserts with a shortcut."
macro = "A saved list of actions an agent runs on a conversation."
"automation rule" = "An event, conditions and actions that run without an agent."
portal = "A public help center with articles."
"branded e-mail layout" = "An inbox's own HTML layout for the e-mails it sends."

[ignore]
paths = ["**/*.lock", "**/pnpm-lock.yaml", "**/package-lock.json", "db/schema.rb", "**/*.min.js", "**/*.map", "public/**", "vendor/**", "theme/**", "deployment/**", "docker/**", "clevercloud/**", "rubocop/**", "script/**", "app/javascript/**/i18n/locale/[!e]*/**", "**/__snapshots__/**", "db/seeds.rb", "lib/seeders/**", "lib/test_data/**", "lib/test_data.rb", "lib/tasks/**", "enterprise/lib/tasks/**", "__mocks__/**", ".github/**", "app/assets/**"]
tests = ["spec/**", "tests/**", "**/specs/**", "**/*.spec.js", "**/*.spec.ts", "**/*_spec.rb", "enterprise/spec/**"]
