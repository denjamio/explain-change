# [[flows]]  # reference runtime flows; the agent compares changed flows against them
# id = "checkout"
# title = "Checkout"
# steps = ["controllers -> services : PlaceOrder", "services -> models : Order.create!"]

[ignore]
paths = ["**/*.lock", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/Gemfile.lock", "**/poetry.lock", "**/*.min.js", "**/*.map", "**/*.generated.*", "**/*.g.cs", "**/*.Designer.cs", "**/dist/**", "**/build/**", "**/bin/**", "**/obj/**", "**/node_modules/**", "**/vendor/**", "db/schema.rb", "**/__snapshots__/**", "**/*.snap"]
tests = ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/e2e/**", "**/*.test.*", "**/*.spec.*", "**/*_test.*", "**/*_spec.rb", "**/test_*.py", "**/*Tests/**", "**/*.Tests/**", "**/*Tests.cs", "**/*Test.cs"]
