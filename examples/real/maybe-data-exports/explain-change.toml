# explain-change config — the source of truth for components, layers and direction.
# Drafted by `explain-change init` from a rails layout. Review every section, then run `explain-change check`.
# Layers are drawn top to bottom in this order (web first, core last); [rules] decides what may depend on what.
# Layers, components and rules are yours: rename, merge or split them so the map reads like this app.
# A file belongs to the component with the most specific matching path.

[project]
name = "maybe"
direction = "Rails conventions: thin controllers, domain logic in models and model namespaces (Family::, Account::), slow work in background jobs."
lang = "en"     # en | es

[[layers]]
id = "web"
name = "Web"

[[layers]]
id = "application"
name = "Application"

[[layers]]
id = "domain"
name = "Domain"

[[layers]]
id = "infrastructure"
name = "Infrastructure"

[[layers]]
id = "other"
name = "Other"

[rules]
# Allow-list of dependency directions (layer or component ids). Anything else is a violation.
# Suggested for this layout; uncomment once the components below are right.
allow = ["web -> application", "web -> domain", "application -> domain", "application -> infrastructure", "infrastructure -> domain"]
same_layer = true

[[components]]
id = "ui"
name = "UI"
layer = "web"
paths = ["app/views/**", "app/components/**", "app/helpers/**", "app/javascript/**"]
desc = "Views, components, helpers and JS"
# constants = ["Billing::*"]   # Ruby constants owned by this component (when not under its paths)

[[components]]
id = "controllers-api"
name = "API controllers"
layer = "web"
paths = ["app/controllers/api/**"]
desc = "Api:: controllers"
# constants = ["Billing::*"]   # Ruby constants owned by this component (when not under its paths)

[[components]]
id = "controllers"
name = "Controllers"
layer = "web"
paths = ["app/controllers/**", "config/routes.rb"]
desc = ""
# constants = ["Billing::*"]   # Ruby constants owned by this component (when not under its paths)

[[components]]
id = "channels"
name = "Channels"
layer = "web"
paths = ["app/channels/**"]
desc = ""
# constants = ["Billing::*"]   # Ruby constants owned by this component (when not under its paths)

[[components]]
id = "services"
