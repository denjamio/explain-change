[project]
name = "orders"
direction = "Vistas finas; la lógica vive en servicios y modelos; las integraciones externas viven en su propia app."
lang = "es"

[[layers]]
id = "web"
name = "Web"
[[layers]]
id = "application"
name = "Aplicación"
[[layers]]
id = "domain"
name = "Dominio"
[[layers]]
id = "infra"
name = "Infraestructura"

[rules]
allow = ["web -> application", "application -> domain", "application -> infra", "infra -> domain"]

[[components]]
id = "orders-api"
name = "API de pedidos"
layer = "web"
paths = ["orders/views.py", "orders/urls.py"]
[[components]]
id = "orders-svc"
name = "Gestión de pedidos"
layer = "application"
paths = ["orders/services.py"]
[[components]]
id = "orders-model"
name = "Pedidos"
layer = "domain"
paths = ["orders/models.py", "orders/migrations/**"]
[[components]]
id = "notifications"
name = "Notificaciones"
layer = "infra"
paths = ["notifications/**"]


[[flows]]
id = "create-order"
title = "Crear pedido"
steps = ["orders-api -> orders-svc : create_order", "orders-svc -> orders-model : Order.place"]
