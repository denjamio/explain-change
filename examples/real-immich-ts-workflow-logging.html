.insp-summary { margin: var(--s2) 0 0; }

.insp-status.rs-implemented { background: var(--added-bg); } .insp-status.rs-implemented b { color: var(--added); }
.insp-status.rs-partial { background: var(--warn-bg); } .insp-status.rs-partial b { color: var(--warn); }
.insp-status.rs-missing { background: var(--violation-bg); } .insp-status.rs-missing b { color: var(--violation); }
.insp-list h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: var(--s4) 0 6px; }
.insp-row { display: flex; gap: var(--s2); align-items: baseline; padding: 3px 0; font-size: 13.5px; min-width: 0; }
.insp-row > a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.insp-row .nums { margin-left: auto; }
.insp-row .badge { padding: 0 7px; font-size: 11.5px; }
.rs-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; align-self: center; }
.rs-dot.rs-implemented { background: var(--added); } .rs-dot.rs-partial { background: var(--warn); } .rs-dot.rs-missing { background: var(--violation); }

/* ── SVG: shared ── */
.view-svg text { font-family: var(--font); fill: var(--text); }
.arrow-unchanged { fill: var(--unchanged); } .arrow-added { fill: var(--added); } .arrow-removed { fill: var(--removed); }
.arrow-violation { fill: var(--violation); } .arrow-key { fill: var(--accent); } .arrow-changed { fill: var(--changed); } .arrow-pipe { fill: var(--border-strong); }
.view-svg [data-k], .view-svg [data-a], .view-svg .edge-g { transition: opacity .25s; }
.view-svg.dim [data-k]:not(.on), .view-svg.dim .edge-g:not(.on), .view-svg.dim .edge-label:not(.on),
.view-svg.dim .link:not(.on), .view-svg.dim .lifeline:not(.on) { opacity: .14; }
.pulse { fill: var(--added); }
.pulse.key { fill: var(--accent); }
.still .pulse { display: none !important; }

/* architecture */
.band { fill: var(--surface); stroke: var(--border); }
.band-label { font-size: 12px; font-weight: 650; fill: var(--muted) !important; letter-spacing: .05em; text-transform: uppercase; }
.band-sub { font-size: 11px; fill: var(--faint) !important; }
.node { cursor: pointer; outline: none; }
.node rect.box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.4; transition: stroke-width .15s; }
.node:hover rect.box, .node:focus-visible rect.box, .node.on rect.box { stroke-width: 2.4; }
.node .tag { font-size: 10px; font-weight: 700; letter-spacing: .07em; }
.node .delta { font-size: 11px; font-variant-numeric: tabular-nums; }
.node .delta .add { fill: var(--added); } .node .delta .del { fill: var(--violation); }
.node .name { font-size: 14px; font-weight: 650; }
.node .info { font-size: 11.5px; fill: var(--muted) !important; }
.node.st-added rect.box { fill: color-mix(in srgb, var(--added-bg) 100%, var(--surface)); stroke: var(--added); }
.node.st-added .tag { fill: var(--added); }
.node.st-changed rect.box { fill: var(--changed-bg); stroke: var(--changed); }
.node.st-changed .tag { fill: var(--changed); }
.node.st-removed rect.box { fill: var(--removed-bg); stroke: var(--removed); stroke-dasharray: 5 4; }
.node.st-removed .tag { fill: var(--removed); }

.node.st-unchanged { opacity: .8; }
.node.st-unchanged rect.box { fill: var(--canvas); stroke-dasharray: 3 3; }
.node.st-unchanged .name { fill: var(--muted); font-weight: 500; }
.edge { fill: none; stroke-width: 1.6; }
.edge.e-unchanged { stroke: var(--unchanged); }
.edge.e-added { stroke: var(--added); stroke-width: 2.2; stroke-dasharray: 7 5; }
/* Motion only where the reader looks: the lit step's arrows and the key dependency. */
.view-svg.dim .edge-g.on .edge.e-added, .edge-g.key .edge.e-added { animation: ec-flow 1.1s linear infinite; }
.view-architecture .edge-g .pulse { display: none; }
.view-architecture .edge-g.key .pulse, .view-architecture.dim .edge-g.on .pulse { display: inline; }
.edge.e-changed { stroke: var(--changed); }
.edge.e-removed { stroke: var(--removed); stroke-dasharray: 5 5; opacity: .8; }
.edge.e-violation { stroke: var(--violation); stroke-width: 2.6; }
.edge.e-violation.existing { stroke-dasharray: 2 4; stroke-width: 2; }
.edge-g.key .edge:not(.e-violation) { stroke: var(--accent); stroke-width: 3; }
.edge-glow { fill: none; stroke: var(--accent); stroke-width: 10; opacity: .14; stroke-linecap: round; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12; }
.edge-label rect { fill: var(--accent); }
.edge-label text { fill: #fff !important; font-size: 11.5px; font-weight: 600; }
.mode-delta .edge.e-unchanged { opacity: .35; stroke-width: 1.2; }
.still .edge.e-added, .still .rel.rc-added { animation: none !important; }
@keyframes ec-flow { to { stroke-dashoffset: -24; } }

/* flow */
.view-flow .lifeline { stroke: var(--border-strong); stroke-dasharray: 4 5; }
.view-flow .head rect { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.4; }
.view-flow .head.st-added rect { fill: var(--added-bg); stroke: var(--added); }
.view-flow .head.st-changed rect { fill: var(--changed-bg); stroke: var(--changed); }
.view-flow .head.st-removed rect { fill: var(--removed-bg); stroke: var(--removed); stroke-dasharray: 5 4; }
.view-flow .head .name { font-size: 13px; font-weight: 650; }

.msg-bg { fill: transparent; }
.msg.on .msg-bg { fill: var(--accent-bg); opacity: .6; }

.step-badge circle { fill: var(--surface-2); stroke: var(--border-strong); }
.step-badge text { font-size: 10.5px; font-weight: 700; fill: var(--muted) !important; }
.msg.st-unchanged .msg-line { stroke: var(--muted); } .msg.st-unchanged .msg-label { fill: var(--muted) !important; }
.msg.st-added .msg-line { stroke: var(--added); } .msg.st-added .msg-label { fill: var(--added) !important; font-weight: 650; }
.msg.st-changed .msg-line { stroke: var(--changed); } .msg.st-changed .msg-label { fill: var(--changed) !important; font-weight: 650; }
.msg.st-removed .msg-line { stroke: var(--removed); stroke-dasharray: 5 4; } .msg.st-removed .msg-label { fill: var(--removed) !important; text-decoration: line-through; }
.msg.unverified .msg-line { stroke-dasharray: 2 4; } .msg.unverified .msg-label { font-style: italic; }

/* ── lists ── */
.ref { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.decisions { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--s4); }

.decision h3 { margin-bottom: var(--s2); }
.decision p { margin: 0 0 var(--s2); }
.decision .alt { color: var(--muted); font-size: 14px; }

/* ── changes by component ── */

.chg + .chg { border-top: 1px solid var(--border); }
.chg-head { display: flex; flex-direction: column; gap: 4px; padding: var(--s3) 0; cursor: pointer; list-style: none; }

.chg-files .insp-row > .ref { min-width: 0; overflow-wrap: anywhere; }
.chg > .chip { margin: 0 0 var(--s3) 18px; }

/* ── files & diff ── */
.gs { font-family: var(--mono); font-weight: 700; font-size: 12px; text-align: center; border-radius: 4px; }
.gs-A { color: var(--added); } .gs-M { color: var(--changed); } .gs-D { color: var(--violation); } .gs-R { color: var(--accent); }
.nums { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.diff { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
.diff-wrap { overflow-x: auto; }
.diff td { padding: 0 var(--s2); white-space: pre; vertical-align: top; }
.diff td.ln { width: 1%; min-width: 36px; text-align: right; color: var(--faint); user-select: none; border-right: 1px solid var(--border); }
.diff td.sg { width: 1%; color: var(--faint); user-select: none; padding-right: 0; }
.diff tr.a { background: var(--diff-add); } .diff tr.a td.sg { color: var(--added); }
.diff tr.d { background: var(--diff-del); } .diff tr.d td.sg { color: var(--violation); }
.diff tr.hl td.code { box-shadow: inset 3px 0 0 var(--accent); }

.excerpt { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.empty { color: var(--muted); font-size: 14px; }

/* ── SDD section: pipeline stepper, requirement × component matrix, scenarios ── */
.sdd-change-head { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.sdd-id { font-size: 14.5px; font-weight: 650; }
.sdd-why { margin: var(--s2) 0 0; color: var(--muted); max-width: 90ch; }
.sdd-pipe-wrap { overflow-x: auto; margin-top: var(--s4); }
.sdd-pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); min-width: 560px; }
.sdd-pipe li { position: relative; }
.sdd-pipe li + li::before { content: ""; position: absolute; top: 15px; left: calc(-50% + 20px); right: calc(50% + 20px); height: 2px; background: var(--border-strong); }
.pstep { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1px; border: 0; background: none; padding: 0 4px 4px; cursor: pointer; text-align: center; border-radius: 10px; }
.pstep:disabled { cursor: default; }
.pstep:not(:disabled):hover .pname, .pstep.on .pname { color: var(--accent); }
.pdot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 750; border: 2px solid var(--border-strong); background: var(--surface); color: var(--muted); margin-bottom: 5px; position: relative; z-index: 1; transition: box-shadow .15s; }
.ps-changed .pdot { background: var(--accent); border-color: var(--accent); color: #fff; }
.ps-present .pdot { border-color: var(--added); color: var(--added); }
.ps-absent .pdot { border-style: dashed; color: var(--faint); }
.ps-removed .pdot { background: var(--removed-bg); border-color: var(--removed); color: var(--removed); }
.pstep.on .pdot, .pstep:not(:disabled):hover .pdot { box-shadow: 0 0 0 5px var(--accent-bg); }
.pname { font-weight: 650; font-size: 14px; }
.ps-absent .pname { color: var(--faint); }
.pstate { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbar { width: 64%; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 3px; }
.pbar i { display: block; height: 100%; background: var(--warn); } .pbar i.full { background: var(--added); }
.sdd-doc { margin-top: var(--s3); padding: var(--s2) var(--s4) var(--s3); border-radius: var(--radius-sm); background: var(--surface-2); font-size: 14.5px; }
.sdd-doc .insp-list h4 { margin-top: var(--s3); }
.tight { margin: 0; padding-left: 18px; } .tight li + li { margin-top: 2px; }

.sdd-reqs { padding-bottom: var(--s3); }
.sdd-cov { display: flex; flex-direction: column; gap: 8px; margin-bottom: var(--s4); max-width: 640px; }
.cov-bar { display: flex; gap: 3px; height: 12px; }
.cov-bar span { min-width: 8px; border-radius: 3px; background: var(--border-strong); }
.cov-bar .rs-implemented { background: var(--added); } .cov-bar .rs-partial { background: var(--warn); }
.cov-bar .rs-missing { background: var(--violation); } .cov-bar .rs-not-applicable { background: var(--faint); }
.cov-bar .rs-pending { background: repeating-linear-gradient(45deg, var(--border-strong) 0 4px, transparent 4px 8px); border: 1px solid var(--border-strong); }
.cov-legend { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.cov-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cov-legend b { color: var(--text); font-variant-numeric: tabular-nums; }

.sdd-matrix { overflow-x: auto; margin: 0 calc(-1 * var(--s5)); padding: 0 var(--s5); }
.sdd-grid { min-width: min-content; }
.sdd-row { display: grid; grid-template-columns: var(--cols); align-items: center; gap: 0 var(--s2); padding: 10px 12px 10px 14px; }
.sdd-head { align-items: end; padding-top: 0; padding-bottom: 6px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.sdd-head .num, .sdd-cell.num { text-align: center; }
.sdd-comp { border: 0; background: none; cursor: pointer; display: flex; justify-content: center; align-items: flex-end; align-self: stretch; padding: 8px 0 6px; border-bottom: 3px solid var(--unchanged); border-radius: 6px 6px 0 0; }
.sdd-comp .vtext { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; text-transform: none; letter-spacing: 0; }
.sdd-comp.st-added { border-bottom-color: var(--added); } .sdd-comp.st-changed { border-bottom-color: var(--changed); } .sdd-comp.st-removed { border-bottom-color: var(--removed); }
.sdd-comp:hover, .sdd-comp.lit { background: var(--accent-bg); } .sdd-comp:hover .vtext, .sdd-comp.lit .vtext { color: var(--accent); }
.sdd-cap { padding: 16px 14px 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--border); }
.sdd-req { border-top: 1px solid var(--border); box-shadow: inset 4px 0 0 var(--accent); }
.sdd-cap + .sdd-req { border-top-style: dashed; }
.sdd-req.op-ADDED { box-shadow: inset 4px 0 0 var(--added); } .sdd-req.op-MODIFIED { box-shadow: inset 4px 0 0 var(--changed); }
.sdd-req.op-REMOVED { box-shadow: inset 4px 0 0 var(--removed); }
.sdd-req > summary { list-style: none; cursor: pointer; border-radius: 0 8px 8px 0; }
.sdd-req > summary::-webkit-details-marker { display: none; }
.sdd-req > summary:hover, .sdd-req.lit > summary { background: var(--surface-2); }
.sdd-req.flash > summary { animation: ec-flash 1.8s ease-out; }
@keyframes ec-flash { from { background: var(--accent-bg); } to { background: transparent; } }
.sdd-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; font-size: 15px; }
.sdd-name::before { content: "▸"; color: var(--faint); width: 10px; }
.sdd-req[open] .sdd-name::before { content: "▾"; }
.op-tag { font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.op-tag.op-ADDED { color: var(--added); } .op-tag.op-MODIFIED { color: var(--changed); } .op-tag.op-REMOVED { color: var(--removed); }
.sdd-req.op-REMOVED .sdd-name b { text-decoration: line-through; color: var(--muted); }
.scn-count { font-size: 13px; }
.sdd-cell { display: grid; place-items: center; height: 28px; border-radius: 6px; }
.sdd-cell.num { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sdd-cell.num.faint { color: var(--faint); }
.cell-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--faint); }
.cell-dot.rs-implemented { background: var(--added); } .cell-dot.rs-partial { background: conic-gradient(var(--warn) 0 50%, var(--warn-bg) 50% 100%); border: 2px solid var(--warn); }
.cell-dot.rs-missing { background: transparent; border: 2px solid var(--violation); }
.rs-pill { justify-self: start; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 650; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.rs-pill.rs-implemented { background: var(--added-bg); color: var(--added); } .rs-pill.rs-partial { background: var(--warn-bg); color: var(--warn); }
.rs-pill.rs-missing { background: var(--violation-bg); color: var(--violation); }
.sdd-detail { padding: 2px 16px 18px 36px; display: flex; flex-direction: column; gap: var(--s3); }
.sdd-text { margin: 0; max-width: 90ch; }
.sdd-note { padding: 8px 12px; border-radius: 8px; font-size: 14px; background: var(--surface-2); max-width: 90ch; }
.sdd-note.rs-partial { background: var(--warn-bg); } .sdd-note.rs-partial b { color: var(--warn); }
.sdd-note.rs-missing { background: var(--violation-bg); } .sdd-note.rs-missing b { color: var(--violation); }
.sdd-note.rs-implemented { background: var(--added-bg); } .sdd-note.rs-implemented b { color: var(--added); }
.sdd-comps-m { display: none; gap: 6px; flex-wrap: wrap; }
.sdd-foot { display: flex; flex-wrap: wrap; gap: 6px var(--s4); align-items: center; font-size: 13px; }
.test-ref { color: var(--accent); }
.sdd-pending { margin: var(--s3) 14px 0; font-style: italic; }
.step-link { margin-top: var(--s2); }

/* scenarios */
.scn-card { display: flex; flex-direction: column; gap: 8px; }
.scn-head { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; font-size: 14px; }
/* scenario flow: state → action → outcomes */
.gwt-flow { --gf-off: 11px; --gf-line: var(--border-strong); display: grid; align-items: stretch; }
.gwt-flow.no-labels { --gf-off: 0px; }
.gwt-flow.no-labels .gf-k { display: none; }
.gf-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gf-col.same { opacity: .42; }
.gf-k { display: inline-flex; align-items: center; gap: 6px; height: 16px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gf-ico { font-style: normal; flex: none; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 8px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border-strong); }
.k-when .gf-k { color: var(--accent); } .k-when .gf-ico { background: var(--accent); border-color: var(--accent); color: #fff; }
.k-then .gf-k { color: var(--text); } .k-then .gf-ico { background: var(--added-bg); border-color: var(--added); color: var(--added); font-size: 10px; font-weight: 800; }
.gf-nodes { display: flex; flex-direction: column; justify-content: center; gap: 6px; flex: 1; }
.gf-node { position: relative; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.k-given .gf-node { background: var(--surface-2); border-style: dashed; border-color: var(--border-strong); }
.k-when .gf-node { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); font-weight: 600; }
.k-then .gf-node { border-color: var(--border-strong); box-shadow: inset 3px 0 0 var(--added); padding-left: 15px; }
.gwt-but { color: var(--warn); text-transform: lowercase; }
.gf-node.empty { background: transparent; border-style: dashed; color: var(--faint); box-shadow: none; font-weight: 400; }
/* the arrow sits on the middle of the nodes, below the column label */
.gf-arrow { position: relative; }
.gf-arrow::before { content: ""; position: absolute; left: 3px; right: 7px; top: calc(50% + var(--gf-off) - 1px); border-top: 2px solid var(--gf-line); }
.gf-arrow::after { content: ""; position: absolute; right: 1px; top: calc(50% + var(--gf-off) - 5px); border: 5px solid transparent; border-right: 0; border-left: 7px solid var(--gf-line); }
.k-when + .gf-arrow::before { border-top-color: var(--accent); } .k-when + .gf-arrow::after { border-left-color: var(--accent); }
/* several lines in a column: they join (given) or branch (then) on a bar beside the arrow */
.k-given .gf-nodes.multi { padding-right: 14px; } .k-then .gf-nodes.multi { padding-left: 14px; }
.k-then .gf-nodes.multi { --gf-line: color-mix(in srgb, var(--accent) 70%, var(--border-strong)); }
.gf-nodes.multi .gf-node::before { content: ""; position: absolute; top: calc(50% - 1px); width: 14px; border-top: 2px solid var(--gf-line); }
.gf-nodes.multi .gf-node::after { content: ""; position: absolute; top: -4px; bottom: -4px; border-left: 2px solid var(--gf-line); }
.gf-nodes.multi .gf-node:first-child::after { top: 50%; } .gf-nodes.multi .gf-node:last-child::after { bottom: 50%; }
.k-given .gf-nodes.multi .gf-node::before { right: -15px; } .k-given .gf-nodes.multi .gf-node::after { right: -15px; }
.k-then .gf-nodes.multi .gf-node::before { left: -15px; } .k-then .gf-nodes.multi .gf-node::after { left: -15px; }
.k-when .gf-nodes.multi { gap: 4px; }
.scn-list { display: flex; flex-direction: column; gap: var(--s4); }
.scn-list .scn-card + .scn-card { padding-top: var(--s3); border-top: 1px dashed var(--border); }
.scn-card.compact { gap: 4px; }
.scn-card.compact .scn-head { font-size: 13px; }
.gwt-flow.compact .gf-node { padding: 4px 10px; font-size: 13px; }
.gwt-flow.compact .k-then .gf-node { padding-left: 13px; }
